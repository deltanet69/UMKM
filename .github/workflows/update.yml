name: Deploy to Expo
on:
  push:
    branches: [main, master]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx expo install --fix
      - run: npx expo update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}